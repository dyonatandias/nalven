map $request_method $nalven_mutation_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    PATCH $binary_remote_addr;
    DELETE $binary_remote_addr;
}

map $uri $nalven_api_key {
    default "";
    ~^/api/ $binary_remote_addr;
}

# Exclude query strings, Referer and token-bearing paths from access logs.
map $uri $nalven_log_path {
    default $uri;
    ~^/(redefinir-senha|convite|avaliar)/ /redacted-token;
    ~^/api/public/avaliacoes/ /api/public/avaliacoes/redacted-token;
}
log_format nalven_safe '$remote_addr [$time_local] "$request_method $nalven_log_path $server_protocol" $status $body_bytes_sent';
limit_req_zone $nalven_api_key zone=nalven_api:10m rate=30r/s;
limit_req_zone $nalven_mutation_key zone=nalven_mutations:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=nalven_connections:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name nalven.com.br www.nalven.com.br;

    server_tokens off;
    access_log /var/log/nginx/nalven-access.log nalven_safe;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    reset_timedout_connection on;

    location ~ /\.(?!well-known/) { deny all; }

    location / {
        limit_req zone=nalven_api burst=90 nodelay;
        limit_req zone=nalven_mutations burst=60 nodelay;
        limit_req_status 429;
        limit_conn nalven_connections 40;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This Nginx is the only trusted inbound proxy. Never preserve a
        # client-supplied X-Forwarded-For value: application rate limits use
        # the first hop. A future CDN must be added through an explicit
        # real_ip allowlist before changing this boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $nalven_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        send_timeout 60s;
    }

    # Tenant media accepts videos up to 100 MB. Application route handlers
    # authenticate, rate-limit, stream-check and validate the actual file type.
    client_max_body_size 105m;
}
